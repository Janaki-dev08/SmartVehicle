        window.setDriverMode = async function(driver) {
          try {
            await fetch('/api/driver/set', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ driver })
            });
          } catch(e) {}
        };

        // Live WebSocket stream & Canvas Renderer
        const canvas = document.getElementById('sim-canvas');
        let ctx = canvas ? canvas.getContext('2d') : null;
        let wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        let wsHost = location.port === '5173' ? 'localhost:8000' : location.host;
        let ws = new WebSocket(wsProtocol + '//' + wsHost + '/ws/telemetry');

        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            updateDashboard(data);
          } catch (e) { }
        };

        function updateDashboard(data) {
          const veh = data.vehicle;
          const risk = data.risk;
          const driver = (data.driver || 'META').toUpperCase();

          // Driver Badge & Selection update
          const driverBadge = document.getElementById('driver-badge');
          const driverModeText = document.getElementById('driver-mode-text');
          const dotMeta = document.getElementById('dot-meta');
          const dotNone = document.getElementById('dot-none');
          const dotCarla = document.getElementById('dot-carla');

          if (driverModeText) {
            if (driver === 'META') {
              driverModeText.innerText = 'AI AGENT (PPO)';
              if (driverBadge) driverBadge.className = 'px-3.5 py-1.5 border border-purple-500/50 bg-gradient-to-r from-purple-900/60 to-indigo-900/60 rounded-lg flex items-center space-x-2 text-xs font-mono text-purple-200';
            } else if (driver === 'CARLA') {
              driverModeText.innerText = 'CARLA HIL';
              if (driverBadge) driverBadge.className = 'px-3.5 py-1.5 border border-cyan-500/50 bg-gradient-to-r from-cyan-900/60 to-blue-900/60 rounded-lg flex items-center space-x-2 text-xs font-mono text-cyan-200';
            } else {
              driverModeText.innerText = 'AUTONOMOUS (A*)';
              if (driverBadge) driverBadge.className = 'px-3.5 py-1.5 border border-amber-500/50 bg-gradient-to-r from-amber-900/60 to-orange-900/60 rounded-lg flex items-center space-x-2 text-xs font-mono text-amber-200';
            }
          }

          if (dotMeta) dotMeta.className = driver === 'META' ? 'w-2 h-2 rounded-full bg-emerald-400' : 'w-2 h-2 rounded-full bg-transparent';
          if (dotNone) dotNone.className = driver === 'NONE' ? 'w-2 h-2 rounded-full bg-emerald-400' : 'w-2 h-2 rounded-full bg-transparent';
          if (dotCarla) dotCarla.className = driver === 'CARLA' ? 'w-2 h-2 rounded-full bg-emerald-400' : 'w-2 h-2 rounded-full bg-transparent';

          // Run state
          const badge = document.getElementById('sim-run-badge');
          if (badge) {
            badge.innerText = data.running ? 'RUNNING' : 'PAUSED';
            badge.className = data.running ? 'text-[10px] px-2 py-0.5 rounded font-mono bg-emerald-500/20 text-emerald-400' : 'text-[10px] px-2 py-0.5 rounded font-mono bg-gray-700 text-gray-300';
          }

          // Carla status
          const carlaText = document.getElementById('carla-status-text');
          const carlaPill = document.getElementById('carla-pill');
          if (carlaText && carlaPill) {
            carlaText.innerText = data.carla.status;
            carlaPill.className = data.carla.connected ? 'px-3 py-1.5 rounded-lg text-xs font-medium border flex items-center space-x-1.5 bg-emerald-950/50 border-emerald-500/50 text-emerald-400' : 'px-3 py-1.5 rounded-lg text-xs font-medium border flex items-center space-x-1.5 bg-amber-950/50 border-amber-500/50 text-amber-400';
          }

          // Telemetry values
          if (document.getElementById('val-speed-kmh')) document.getElementById('val-speed-kmh').innerText = veh.speed_kmh.toFixed(1);
          if (document.getElementById('val-speed-ms')) document.getElementById('val-speed-ms').innerText = veh.speed_ms.toFixed(2) + ' m/s';
          if (document.getElementById('val-accel')) document.getElementById('val-accel').innerText = 'Acc: ' + veh.acceleration_ms2.toFixed(1) + ' m/s²';
          if (document.getElementById('val-heading')) document.getElementById('val-heading').innerText = veh.heading_deg.toFixed(1) + '°';
          if (document.getElementById('val-threats')) document.getElementById('val-threats').innerText = risk.threat_count;
          if (document.getElementById('val-steer')) document.getElementById('val-steer').innerText = veh.steering_angle.toFixed(2);
          if (document.getElementById('val-throttle')) document.getElementById('val-throttle').innerText = Math.round(veh.throttle * 100) + '%';
          if (document.getElementById('val-brake')) document.getElementById('val-brake').innerText = Math.round(veh.brake * 100) + '%';

          // Bars
          if (document.getElementById('bar-throttle')) document.getElementById('bar-throttle').style.width = (veh.throttle * 100) + '%';
          if (document.getElementById('bar-brake')) document.getElementById('bar-brake').style.width = (veh.brake * 100) + '%';

          // Risk & Action
          const badgeRisk = document.getElementById('badge-risk');
          if (badgeRisk) {
            badgeRisk.innerText = risk.risk_level;
            if (risk.risk_level === 'CRITICAL') badgeRisk.className = 'px-2.5 py-1 rounded-lg text-xs font-bold bg-red-600 text-white animate-bounce';
            else if (risk.risk_level === 'HIGH') badgeRisk.className = 'px-2.5 py-1 rounded-lg text-xs font-bold bg-orange-500 text-white';
            else if (risk.risk_level === 'MEDIUM') badgeRisk.className = 'px-2.5 py-1 rounded-lg text-xs font-bold bg-amber-500 text-black';
            else badgeRisk.className = 'px-2.5 py-1 rounded-lg text-xs font-bold bg-emerald-600 text-white';
          }

          const badgeAction = document.getElementById('badge-action');
          if (badgeAction) badgeAction.innerText = data.action;

          if (document.getElementById('val-ttc')) document.getElementById('val-ttc').innerText = risk.min_ttc ? risk.min_ttc.toFixed(1) + ' s' : 'SAFE (>10s)';
          if (document.getElementById('val-nearest-obs')) document.getElementById('val-nearest-obs').innerText = risk.nearest_obstacle ? risk.nearest_obstacle.class_name.toUpperCase() + ' (' + risk.nearest_distance.toFixed(1) + 'm)' : 'None';
          if (document.getElementById('val-clearance')) document.getElementById('val-clearance').innerText = risk.lateral_clearance.toFixed(1) + ' m';

          // Detections List
          const countObs = document.getElementById('count-obs');
          const listObs = document.getElementById('list-detections');
          if (countObs) countObs.innerText = data.perception.detected_objects_count;
          if (listObs) {
            if (data.perception.objects.length === 0) {
              listObs.innerHTML = '<div class="text-gray-500 text-center py-4">No obstacles in range</div>';
            } else {
              listObs.innerHTML = data.perception.objects.map(o => `
                  <div class="bg-dark-800/80 border border-dark-700 rounded-lg p-2 flex justify-between">
                    <span class="text-cyan-400 font-bold">#${o.object_id} <span class="text-white capitalize">${o.class_name}</span></span>
                    <span class="text-amber-400 font-mono">${o.distance.toFixed(1)}m</span>
                  </div>
                `).join('');
            }
          }

          // Metrics
          if (document.getElementById('m-avg-speed')) document.getElementById('m-avg-speed').innerText = data.metrics.avg_speed_kmh.toFixed(1) + ' km/h';
          if (document.getElementById('m-min-ttc')) document.getElementById('m-min-ttc').innerText = data.metrics.min_ttc_seconds.toFixed(2) + ' s';
          if (document.getElementById('m-clearance')) document.getElementById('m-clearance').innerText = data.metrics.avg_obstacle_clearance_m.toFixed(2) + ' m';
          if (document.getElementById('m-latency')) document.getElementById('m-latency').innerText = data.metrics.avg_planning_time_ms.toFixed(1) + ' ms';
          if (document.getElementById('m-replans')) document.getElementById('m-replans').innerText = data.metrics.total_replans;
          if (document.getElementById('m-success')) document.getElementById('m-success').innerText = data.metrics.navigation_success_rate_percent.toFixed(1) + '%';

          // Replanning events log
          if (data.latest_replans && data.latest_replans.length > 0) {
            const logs = document.getElementById('bottom-logs');
            if (logs) {
              logs.innerHTML = data.latest_replans.map(r => `
                  <div><span class="text-cyan-400 font-bold">[REPLAN #${r.id}]</span> ${r.reason} (${r.latency_ms}ms)</div>
                `).join('');
            }
          }

          // Render Canvas
          renderCanvas(data);
        }

        function renderCanvas(data) {
          if (!canvas || !ctx) return;
          const w = canvas.parentElement.clientWidth || 800;
          const h = canvas.parentElement.clientHeight || 500;
          canvas.width = w;
          canvas.height = h;

          const originX = w / 2;
          const originY = h - 70;
          const ppm = 11;

          const toX = (y) => originX + y * ppm;
          const toY = (x) => originY - x * ppm;

          // BG
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(0, 0, w, h);

          // Road
          const rw = (data.road_width || 8.0) / 2;
          const rL = toX(-rw);
          const rR = toX(rw);

          ctx.fillStyle = '#261e14';
          ctx.fillRect(rL - 30, 0, rR - rL + 60, h);

          ctx.fillStyle = '#1e293b';
          ctx.fillRect(rL, 0, rR - rL, h);

          // Bounds
          ctx.strokeStyle = '#64748b';
          ctx.lineWidth = 2;
          ctx.setLineDash([10, 10]);
          ctx.strokeRect(rL, 0, rR - rL, h);
          ctx.setLineDash([]);

          // Grid lines
          ctx.strokeStyle = '#334155';
          ctx.font = '10px monospace';
          ctx.fillStyle = '#64748b';
          for (let d = 10; d <= 60; d += 10) {
            const y = toY(d);
            ctx.beginPath();
            ctx.moveTo(rL - 20, y);
            ctx.lineTo(rR + 20, y);
            ctx.stroke();
            ctx.fillText('+' + d + 'm', rR + 5, y - 2);
          }

          // Global Route
          if (data.planner.global_path && data.planner.global_path.length > 1) {
            ctx.strokeStyle = 'rgba(59, 130, 246, 0.4)';
            ctx.lineWidth = 5;
            ctx.beginPath();
            data.planner.global_path.forEach((pt, i) => {
              const cx = toX(pt[1] - data.vehicle.position.y);
              const cy = toY(pt[0] - data.vehicle.position.x);
              if (i === 0) ctx.moveTo(cx, cy); else ctx.lineTo(cx, cy);
            });
            ctx.stroke();
          }

          // Planned A* Path
          if (data.planner.local_path && data.planner.local_path.length > 1) {
            ctx.strokeStyle = '#06b6d4';
            ctx.lineWidth = 3;
            ctx.beginPath();
            data.planner.local_path.forEach((pt, i) => {
              const cx = toX(pt[1]);
              const cy = toY(pt[0]);
              if (i === 0) ctx.moveTo(cx, cy); else ctx.lineTo(cx, cy);
            });
            ctx.stroke();
          }

          // Obstacles
          data.perception.objects.forEach(o => {
            const cx = toX(o.relative_position[1]);
            const cy = toY(o.relative_position[0]);

            // Prediction
            if (o.predicted_trajectory) {
              ctx.strokeStyle = '#f97316';
              ctx.lineWidth = 1.5;
              ctx.setLineDash([4, 4]);
              ctx.beginPath();
              o.predicted_trajectory.forEach((pt, i) => {
                const px = toX(pt[1]);
                const py = toY(pt[0]);
                if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
              });
              ctx.stroke();
              ctx.setLineDash([]);
            }

            // Body
            let col = '#22c55e';
            if (o.class_name === 'pedestrian') col = '#f97316';
            else if (o.class_name === 'motorcycle') col = '#ec4899';
            else if (o.class_name === 'auto_rickshaw') col = '#eab308';
            else if (o.class_name === 'animal') col = '#a855f7';
            else if (o.class_name === 'debris') col = '#ef4444';

            ctx.fillStyle = col;
            ctx.fillRect(cx - 10, cy - 14, 20, 28);
            ctx.strokeStyle = '#ffffff';
            ctx.strokeRect(cx - 10, cy - 14, 20, 28);

            ctx.fillStyle = '#ffffff';
            ctx.font = '9px sans-serif';
            ctx.fillText(o.class_name.toUpperCase() + ' ' + o.distance.toFixed(1) + 'm', cx - 25, cy - 18);
          });

          // Ego Vehicle
          const egox = toX(0);
          const egoy = toY(0);
          ctx.fillStyle = '#2563eb';
          ctx.fillRect(egox - 11, egoy - 28, 22, 28);
          ctx.strokeStyle = '#93c5fd';
          ctx.strokeRect(egox - 11, egoy - 28, 22, 28);

          ctx.fillStyle = '#60a5fa';
          ctx.font = 'bold 9px monospace';
          ctx.fillText('EGO VEHICLE', egox - 30, egoy + 14);
        }
      }
    }, 500);
  </script>
</body>
